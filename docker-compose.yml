services:
  postgres:
    image: postgres:latest
    container_name: tally-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
#    volumes:
#      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tally-redis
    ports:
      - "6379:6379"